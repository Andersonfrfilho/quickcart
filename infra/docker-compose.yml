services:
  postgres:
    image: postgres:17
    container_name: ${PROJECT_NAME:-quickcart}-${APP_ENV:-dev}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickcart_dev}
      POSTGRES_USER: ${POSTGRES_USER:-quickcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickcart}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quickcart}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-quickcart}-${APP_ENV:-dev}-redis
    ports:
      - "${REDIS_PORT:-6390}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: ${PROJECT_NAME:-quickcart}-${APP_ENV:-dev}-wiremock
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "${WIREMOCK_PORT:-9563}:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  # Storage S3-compatível para os arquivos da conversa. O mesmo código serve para bucket
  # gerenciado depois: o object-storage-provider fala S3, então só endpoint e credencial mudam.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: ${PROJECT_NAME:-quickcart}-${APP_ENV:-dev}-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-quickcart}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-quickcart123}
    ports:
      - "${MINIO_PORT:-9566}:9000"
      - "${MINIO_CONSOLE_PORT:-9567}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # O MinIO não cria bucket sozinho, e o provider assume que ele existe (healthCheckBucket).
  # Serviço de um tiro: cria e sai.
  # Caixa de entrada falsa para o canal de e-mail do notification-module. Sem ela, e-mail em
  # desenvolvimento vira "não sei se saiu": o driver reporta `sent` e não há onde conferir o que
  # chegou, nem o HTML renderizado. Mailpit aceita qualquer credencial e não entrega nada para fora,
  # que é exatamente o que se quer — um SMTP real em dev manda mensagem de teste para cliente real.
  mailpit:
    # GHCR e não Docker Hub: o Hub pede autenticação para pull anônimo depois do limite de taxa, e
    # `make up` falhava com "authentication required" numa máquina sem `docker login`. A imagem é a
    # mesma, publicada pelo próprio projeto.
    image: ghcr.io/axllent/mailpit:v1.21
    container_name: ${PROJECT_NAME:-quickcart}-${APP_ENV:-dev}-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: ${PROJECT_NAME:-quickcart}-${APP_ENV:-dev}-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID:-quickcart} ${STORAGE_SECRET_ACCESS_KEY:-quickcart123} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-quickcart-documents} &&
      echo 'bucket pronto'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
